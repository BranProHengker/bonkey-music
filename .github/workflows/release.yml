name: Release Application

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bonkey Music ${{ github.ref_name }}'
          releaseBody: |
            ## What's Changed in v2.2.4
            - **Performance & CPU Optimization**: Decoupled high-frequency playback state via `AudioTimeContext` (re-render rate cut by ~93%), eliminating UI micro-stutters.
            - **Stabilized Event Listeners**: Window listeners for global shortcuts, mouse drag, and volume wheel are now permanently stabilized with zero per-frame re-binding.
            - **Virtualized & Memoized TrackList**: Added `TrackRow` memoization and Chromium `content-visibility: auto`, drastically reducing DOM overhead on large playlists.
            - **Hardware-Composited Lyrics**: Removed CPU-heavy dynamic font blur filters in favor of pure GPU-accelerated opacity & transforms.
            - **Cleaned Main Process IPC**: Throttled Discord RPC updates and silenced debug logging.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


