name: Release Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Release Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build and Release Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bonkey Music ${{ github.ref_name }}'
          releaseBody: |
            ## What's Changed in ${{ github.ref_name }}
            - **100% Electron & UI Klasik Purge**: Pure Tauri v2 + React architecture, 0 Electron residue, pruned 285 unused dependencies.
            - **Auto-Scan Audio System**: Automatic music detection targeting Android storage and desktop audio directories with no manual folder selection needed.
            - **Mobile-Responsive Ergonomics**: 2-tier floating pill dock, adaptive Now Playing sheet with swipe gesture, artist subtitles on mobile track rows, and Android safe-area insets.
            - **Discord RPC & Metadata Upgrades**: High-res remote cover art detection and embedded lyrics extraction.
            - **Android APK Build Pipeline**: Cloud CI/CD build producing Android APK binaries.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    name: Release Android (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true
          link-to-sdk: true

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/*/bin/sdkmanager --licenses || true

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Android APK
        run: |
          # Resolve NDK_HOME reliably from environment or filesystem
          if [ -z "$NDK_HOME" ]; then
            export NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          fi
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            export NDK_HOME=$(find "$ANDROID_HOME/ndk" /opt/hostedtoolcache/ndk -maxdepth 2 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Verified NDK_HOME=$NDK_HOME"
          export ANDROID_NDK_HOME="$NDK_HOME"

          pnpm tauri android init
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
          fi
          pnpm tauri android build --apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonkey-music-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" src-tauri/gen/android/app/build/outputs/apk/**/*.apk --clobber



