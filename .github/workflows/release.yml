name: Release Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Release Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build and Release Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bonkey Music ${{ github.ref_name }}'
          releaseBody: |
            ## Perubahan di ${{ github.ref_name }}

            - **Fix AppImage Blank di Linux (CachyOS / Wayland)**: Mengatasi masalah layar abu-abu pada AppImage di sesi Wayland/XWayland dengan mengatur fallback DMA-BUF renderer WebKitGTK.
            - **Fix Update APK Android Bentrok**: Menggunakan keystore rilis permanen agar update APK baru bisa langsung menimpa versi lama tanpa perlu uninstall atau kehilangan data.
            - **Android Media Notification & Lockscreen**: Kontrol notifikasi sekarang menampilkan seekbar aktif, navigasi lagu, dan gambar cover album.
            - **Buka Ulang App Instan (0ms Warm Start)**: Daftar lagu langsung muncul saat aplikasi dibuka kembali tanpa jeda atau layar kosong.
            - **Pembersihan Tampilan Mobile**: Merapikan daftar lagu, menyelaraskan style dock liquid glass, dan menghapus tombol navigasi redundant.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    name: Release Android (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true
          link-to-sdk: true

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/*/bin/sdkmanager --licenses || true

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Android APK
        run: |
          # Resolve NDK_HOME reliably from environment or filesystem
          if [ -z "$NDK_HOME" ]; then
            export NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          fi
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            export NDK_HOME=$(find "$ANDROID_HOME/ndk" /opt/hostedtoolcache/ndk -maxdepth 2 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Verified NDK_HOME=$NDK_HOME"
          export ANDROID_NDK_HOME="$NDK_HOME"

          mkdir -p ~/.android
          cp scripts/bonkey-music.keystore ~/.android/debug.keystore

          pnpm tauri android init
          node scripts/setup-android.js

          pnpm tauri android build --apk --debug --target aarch64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonkey-music-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          APK_FILES=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          if [ ${#APK_FILES[@]} -eq 0 ]; then
            mapfile -t APK_FILES < <(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f)
          fi
          echo "Found APK files: ${APK_FILES[*]}"

          UPLOAD_FILES=()
          for apk in "${APK_FILES[@]}"; do
            CLEAN_APK="src-tauri/gen/android/app/build/outputs/apk/Bonkey.Music_${{ github.ref_name }}_android.apk"
            cp "$apk" "$CLEAN_APK"
            UPLOAD_FILES+=("$CLEAN_APK")
            UPLOAD_FILES+=("$apk")
          done

          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} does not exist yet. Creating entry..."
            gh release create "${{ github.ref_name }}" --title "Bonkey Music ${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}"
          fi

          gh release upload "${{ github.ref_name }}" "${UPLOAD_FILES[@]}" --clobber






